[pytest]
addopts = --strict-markers --basetemp=artifacts/test_tmp/pytest
cache_dir = artifacts/test_tmp/.pytest_cache
testpaths = tests
markers =
    unit: Fast isolated unit tests.
    integration: Multi-module contract and orchestration tests.
    api: FastAPI endpoint and schema tests.
    e2e_synthetic: End-to-end synthetic pipeline and API smoke tests.
    requires_dat_file: Tests that need the real tolouene .dat file on disk (optional local / DVC pipeline).
